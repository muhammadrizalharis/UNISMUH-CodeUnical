name: codeunical

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeunical-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeunical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-codeunical}
    ports:
      - "127.0.0.1:47432:5432"
    volumes:
      - codeunical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeunical}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: codeunical-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-codeunical}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?wajib diisi di .env}
    ports:
      - "127.0.0.1:47900:9000"
      - "127.0.0.1:47901:9001"
    volumes:
      - codeunical-miniodata:/data

  proctor-ai:
    build: ./proctor-ai
    image: codeunical-proctor-ai:latest
    container_name: codeunical-proctor-ai
    restart: unless-stopped
    environment:
      DEVICE: cuda:0
      MODELS_DIR: /models
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.35}
      PHONE_CONF: ${PHONE_CONF:-0.35}
    ports:
      - "127.0.0.1:47610:47610"
    # Reserve 1 GPU (default GPU index 1); model resident di VRAM (standby ~3-4 GB).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PROCTOR_GPU:-1}"]
              capabilities: [gpu]

volumes:
  codeunical-pgdata:
  codeunical-miniodata:
